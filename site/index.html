<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a2d31">
<title>개발 트렌드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Gothic+A1:wght@400;500;700;800&display=swap">
<style>
:root{
  --steel:#2a2d31;--steel-2:#33373c;--steel-3:#4a4e55;--board:#141518;--flap:#0b0b0d;--seam:#26282c;
  --ink:#f2f2f2;--label:#a7aaaf;--amber:#ffb000;--red:#ff6b5e;--up:#f2f2f2;
  --c1:#f2f2f2;--c2:#ffb000;--c3:#a7aaaf;--c4:#ff6b5e;--c5:#f2f2f2;
  --cond:'Barlow Condensed','Gothic A1',sans-serif;--ko:'Gothic A1',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--steel);color-scheme:dark;scrollbar-color:var(--steel-3) var(--steel)}
body{margin:0;background:var(--steel);color:var(--ink);font-family:var(--ko);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
::selection{background:var(--amber);color:var(--flap)}
a{color:inherit;text-decoration:none;text-underline-offset:3px}
a:hover{text-decoration:underline;text-decoration-color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px;border-radius:1px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums;font-weight:600;letter-spacing:.02em}

/* 상단 바 */
.bar{position:sticky;top:0;z-index:5;background:linear-gradient(#34383d,var(--steel));border-bottom:1px solid var(--steel-3)}
.bar-in{max-width:1280px;margin:0 auto;padding:0 20px;min-height:60px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 24px}
.bar h1{margin:0 auto 0 0;font-size:20px;font-weight:800;letter-spacing:.04em}
.bar nav{display:flex;gap:2px}
.bar nav a{font-family:var(--cond);font-size:17px;font-weight:600;letter-spacing:.12em;color:var(--label);padding:10px 12px;min-height:44px;display:inline-flex;align-items:center}
.bar nav a:hover{color:var(--ink);text-decoration:none}
.stamp{font-size:13px;color:var(--label)}

main{max-width:1280px;margin:0 auto;padding:20px 20px 64px;display:flex;flex-direction:column;gap:20px}
.board{background:var(--board);border:1px solid var(--steel-3);border-radius:3px;padding:18px 20px 20px;min-width:0;scroll-margin-top:72px}
.board>h2{margin:0 0 16px;font-size:19px;font-weight:800;letter-spacing:.02em;color:var(--label);display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.board>h2 small{font-size:12px;letter-spacing:.02em;font-weight:500}

/* 판 */
.flaps{display:inline-flex;gap:.09em;vertical-align:middle}
.f{position:relative;display:inline-grid;place-items:center;background:linear-gradient(#1b1c20 0 50%,var(--flap) 50%);box-shadow:inset 0 1px 0 #2b2d32,0 1px 2px rgba(0,0,0,.5);color:var(--ink);font-family:var(--cond);font-weight:600;line-height:1;border-radius:2px;width:.78em;height:1.18em;font-size:inherit;overflow:hidden}
.f::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(0,0,0,.55)}
.ctr .f::after{height:2px;top:calc(50% - 1px);background:rgba(0,0,0,.7)}
.f.blank{color:transparent}
.f.tick{animation:tick 70ms ease-out}
@keyframes tick{from{transform:scaleY(.25);filter:brightness(.6)}to{transform:none;filter:none}}
.amber .f{color:var(--amber)}.red .f{color:var(--red)}

/* 카운터 띠 */
.counters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;background:var(--steel-3);border:1px solid var(--steel-3);border-radius:3px;overflow:hidden}
.ctr{background:var(--board);padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.ctr .l{font-size:13px;letter-spacing:.02em;color:var(--label);font-weight:700}
.ctr .flaps{font-size:64px}
.ctr .s{font-size:13px;color:var(--label);overflow-wrap:anywhere}
.ctr .word{font-family:var(--cond);font-size:64px;font-weight:700;color:var(--amber);line-height:1.18;overflow-wrap:anywhere}

.grid-top{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
.side{display:flex;flex-direction:column;gap:20px;position:sticky;top:80px}

/* 순위표 */
table{width:100%;border-collapse:collapse}
th{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--label);text-align:left;padding:0 10px 10px;border-bottom:1px solid var(--steel-3)}
td{padding:12px 10px;border-bottom:1px solid var(--seam);vertical-align:middle}
tr:last-child td{border-bottom:0}
th:first-child,td:first-child{padding-left:0}th:last-child,td:last-child{padding-right:0;text-align:right}
.c-rk .flaps{font-size:28px}.c-gain .flaps{font-size:22px}
.repo a{font-family:var(--cond);font-weight:700;font-size:21px;letter-spacing:.03em;overflow-wrap:anywhere}
.desc{font-size:14px;color:#dcdde0;margin-top:3px}
.orig{font-size:12px;color:var(--label);margin-top:2px}
.lang{font-family:var(--cond);font-size:16px;letter-spacing:.06em;color:var(--label);white-space:nowrap}
.gain{font-size:24px;white-space:nowrap}
.mv{display:inline-flex;align-items:center;gap:4px;font-family:var(--cond);font-weight:700;font-size:16px;letter-spacing:.06em;padding:3px 8px;border-radius:2px;background:var(--flap);white-space:nowrap}
.mv svg{width:9px;height:9px}
.mv.up{color:var(--up)}.mv.down{color:var(--red)}.mv.new{color:var(--flap);background:var(--amber)}.mv.same{color:var(--label)}
.spark{display:block}.nospark{font-size:12px;color:var(--label);white-space:nowrap}

/* 진입·이탈 */
.kv{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--seam);font-size:15px}
.kv:last-child{border-bottom:0}
.kv a{font-family:var(--cond);font-weight:700;font-size:18px;letter-spacing:.03em;overflow-wrap:anywhere;min-width:0}
.empty{font-size:14px;color:var(--label)}
.warn{font-size:13px;font-weight:700;color:var(--flap);background:var(--amber);border-radius:2px;padding:6px 10px;margin-bottom:12px;display:inline-block}

/* 추이 그래프 */
.axis{display:flex;justify-content:space-between;font-family:var(--cond);font-size:15px;letter-spacing:.06em;color:var(--label);margin-top:6px}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:12px;font-size:13px;color:var(--label)}
.legend span{display:inline-flex;align-items:center;gap:8px}.legend i{width:18px;height:3px;display:inline-block}

/* 키워드 */
.kw{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:8px 32px}
.kwrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--seam)}
.kwrow b{font-family:var(--cond);font-size:22px;font-weight:700;letter-spacing:.04em;overflow-wrap:anywhere}
.kwrow small{display:block;font-size:12px;color:var(--label)}
.kwrow .flaps{font-size:22px}

/* HN · arXiv */
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:12px 0;border-bottom:1px solid var(--seam);align-items:start}
.item:last-child{border-bottom:0}
.item .flaps{font-size:20px}
.item a.t{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--label);margin-top:4px}
.meta a{text-decoration:underline;text-decoration-color:var(--steel-3)}
.cat{font-family:var(--cond);font-weight:700;font-size:15px;letter-spacing:.06em;background:var(--flap);color:var(--amber);padding:3px 7px;border-radius:2px;white-space:nowrap}

footer{max-width:1280px;margin:0 auto;padding:0 20px 40px;font-size:12px;color:var(--label)}

@media (max-width:1000px){
  .grid-top{grid-template-columns:minmax(0,1fr)}
  .side{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));position:static}
  .pair{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .bar-in{padding:6px 12px;gap:0 12px}.bar nav a{padding:10px 8px;font-size:16px}.stamp{width:100%;padding-bottom:6px}
  main{padding:12px 12px 48px;gap:12px}
  .board{padding:14px 12px 14px}
  .counters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ctr .flaps{font-size:34px}.ctr .word{font-size:34px}
  .side{grid-template-columns:minmax(0,1fr);gap:12px}
  /* 표를 2줄 행으로 접기 */
  thead{display:none}
  table,tbody{display:block}
  tr{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"rk repo repo repo" "rk mv spark gain";gap:8px 12px;padding:14px 0;border-bottom:1px solid var(--seam);align-items:center}
  tr:last-child{border-bottom:0}
  td{padding:0;border:0}
  td.c-rk{grid-area:rk}.c-repo{grid-area:repo}.c-gain{grid-area:gain;text-align:right}.c-mv{grid-area:mv}.c-spark{grid-area:spark;text-align:right}.c-lang{display:none}
  .c-rk{align-self:start}.c-rk .flaps{font-size:22px}.c-gain .flaps{font-size:17px}
}
@media (prefers-reduced-motion:reduce){.f.tick{animation:none}}
</style>
</head>
<body>
<header class="bar"><div class="bar-in">
  <h1>개발 트렌드</h1>
  <nav aria-label="섹션 이동"><a href="#repos">레포</a><a href="#keywords">키워드</a><a href="#hn">HN</a><a href="#arxiv">arXiv</a></nav>
  <span class="stamp" id="updated">불러오는 중</span>
</div></header>
<main>
  <section class="counters" id="counters" aria-label="오늘 요약"></section>
  <div class="grid-top">
    <section class="board" id="repos"><h2>이번 주 별 증가 순위 <small id="repos-sub">GitHub Trending 주간 · 변동은 어제 대비</small></h2><div id="table"></div></section>
    <div class="side">
      <section class="board" id="entered"><h2>새로 진입</h2></section>
      <section class="board" id="dropped"><h2>순위에서 빠짐</h2></section>
    </div>
  </div>
  <section class="board" id="trend"><h2>상위 5개 레포 14일 누적 별</h2><div id="chart"></div><div class="legend" id="legend"></div></section>
  <section class="board" id="keywords"><h2>뜨는 키워드 <small>HN 제목 · 레포 설명 · arXiv 제목 · 오늘과 7일 평균 비교</small></h2></section>
  <div class="pair">
    <section class="board" id="hn"><h2>Hacker News 인기 글</h2></section>
    <section class="board" id="arxiv"><h2>arXiv 최신 논문</h2></section>
  </div>
</main>
<footer>매일 아침 GitHub Actions가 수집해 갱신함. 번역은 DeepL.</footer>
<script>
// 외부 데이터는 전부 textContent/속성으로만 넣는다 (innerHTML 금지).
const SVG = "http://www.w3.org/2000/svg";
const SERIES = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];
const REDUCED = matchMedia("(prefers-reduced-motion: reduce)").matches;
const $ = (id) => document.getElementById(id);
const fmt = (n) => Number(n).toLocaleString("en-US");

function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k === "class") e.className = v; else if (k === "style") e.style.cssText = v; else e.setAttribute(k, v);
  }
  for (const k of kids) if (k != null) e.append(k instanceof Node ? k : String(k));
  return e;
}
function svgEl(tag, attrs) {
  const e = document.createElementNS(SVG, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  return e;
}
function safeUrl(u) { return /^https?:\/\//i.test(u || "") ? u : "#"; }
function link(href, text, attrs) { return el("a", { href: safeUrl(href), rel: "noopener", ...(attrs || {}) }, text); }
function orig(text) { return el("div", { class: "orig", lang: "en" }, text); }
function failNote() { return el("div", { class: "warn" }, "수집 실패"); }
function staleNote(src) { return src && src.stale_days > 0 ? el("div", { class: "warn" }, `오늘 수집 실패 · ${src.stale_days}일 전 데이터`) : null; }

// 판: 글자마다 칸 하나. 읽기 도구에는 완성된 글자만 전달.
const FLIP = [];
function flaps(text, opts) {
  const o = opts || {}, s = String(text), w = Math.max(o.width || 0, s.length);
  const padded = s.padStart(w, " ");
  const box = el("span", { class: "flaps num" + (o.tone ? " " + o.tone : ""), style: o.size ? `font-size:${o.size}px` : "" });
  box.append(el("span", { class: "sr" }, s));
  for (const ch of padded) {
    const c = el("span", { class: "f" + (ch === " " ? " blank" : ""), "aria-hidden": "true" }, ch === " " ? "0" : ch);
    if (/\d/.test(ch)) FLIP.push(c);
    box.append(c);
  }
  return box;
}
// 서명 동작: 숫자 판이 시차를 두고 따르륵 넘어가며 최종값에 멈춘다.
function cascade() {
  if (REDUCED) return;
  FLIP.forEach((c, i) => {
    const final = c.textContent, steps = 4 + (i % 5);
    let n = 0;
    setTimeout(function step() {
      c.classList.remove("tick"); void c.offsetWidth; c.classList.add("tick");
      c.textContent = n < steps ? String((Number(final) + steps - n) % 10) : final;
      if (n++ < steps) setTimeout(step, 70);
    }, Math.min(i * 18, 900));
  });
}

function moveBadge(r) {
  const tri = (up) => { const s = svgEl("svg", { viewBox: "0 0 10 10", "aria-hidden": "true" }); s.append(svgEl("path", { d: up ? "M5 1 9.5 9h-9z" : "M5 9 .5 1h9z", fill: "currentColor" })); return s; };
  if (r.is_new) return el("span", { class: "mv new" }, "NEW");
  if (r.move > 0) return el("span", { class: "mv up", "aria-label": `${r.move}계단 상승` }, tri(true), r.move);
  if (r.move < 0) return el("span", { class: "mv down", "aria-label": `${-r.move}계단 하락` }, tri(false), -r.move);
  return el("span", { class: "mv same", "aria-label": "변동 없음" }, "–");
}

// null 에서 끊긴 선. 모든 행이 같은 축척(max)을 쓴다.
function lines(svg, values, w, h, max, color, width) {
  const n = values.length, x = (i) => (n === 1 ? w / 2 : (i * w) / (n - 1)), y = (v) => h - (Math.max(0, v) / max) * h;
  let run = [];
  const flush = () => {
    if (run.length === 1) svg.append(svgEl("circle", { cx: run[0][0], cy: run[0][1], r: width + 0.5, fill: color }));
    else if (run.length > 1) svg.append(svgEl("polyline", { points: run.map((p) => p.join(",")).join(" "), fill: "none", stroke: color, "stroke-width": width, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    run = [];
  };
  values.forEach((v, i) => (v == null ? flush() : run.push([x(i).toFixed(1), y(v).toFixed(1)])));
  flush();
}
const maxOf = (arrs) => Math.max(1, ...arrs.flat().filter((v) => v != null));

function renderCounters(h) {
  const g = h.github, hn = h.hn, k = h.keywords;
  const top = g.repos && g.repos.find((r) => r.name === g.top5[0]);
  const best = hn.items ? hn.items.reduce((a, b) => (b.points > a.points ? b : a)) : null;
  const ago = (src) => (src.stale_days > 0 ? ` · ${src.stale_days}일 전 데이터` : "");
  const hasPrev = g.repos && g.repos.some((r) => r.move != null || r.is_new);
  const ctr = (label, value, sub) => el("div", { class: "ctr" }, el("span", { class: "l" }, label), value, el("span", { class: "s" }, sub));
  $("counters").append(
    ctr("1위 7일 증가", top ? flaps("+" + fmt(top.stars_week), { tone: "amber" }) : el("span", { class: "word" }, "–"), top ? top.name + ago(g) : "수집 실패"),
    ctr("새로 진입", hasPrev ? flaps(g.entered.length) : el("span", { class: "word" }, "–"), hasPrev ? "어제 대비" + ago(g) : "비교할 어제 데이터 없음"),
    ctr("HN 최고 점수", best ? flaps(fmt(best.points)) : el("span", { class: "word" }, "–"), best ? (best.title_ko || best.title) : "수집 실패"),
    ctr("뜨는 키워드", el("span", { class: "word", lang: "en" }, k.ready && k.items.length ? k.items[0].word : "–"),
      k.ready ? (k.items.length ? `7일 평균 대비 +${k.items[0].change_pct}%` : "눈에 띄는 변화 없음") : "데이터 쌓는 중 (8일 필요)"));
}

function renderRepos(h) {
  const g = h.github;
  if (g.error) { ["table", "entered", "dropped", "chart"].forEach((id) => $(id).append(failNote())); return; }
  const note = staleNote(g); if (note) $("table").before(note);
  const max = maxOf(g.repos.map((r) => r.spark));
  const head = el("tr", {}, ...["순위", "변동", "레포", "언어", "14일", "7일 증가"].map((t) => el("th", { scope: "col" }, t)));
  const rows = g.repos.map((r) => {
    const pts = r.spark.filter((v) => v != null).length;
    let run = 0, best = 0;
    for (const v of r.spark) { run = v == null ? 0 : run + 1; best = Math.max(best, run); }
    let sp;
    if (best < 3) sp = el("span", { class: "nospark" }, pts ? `기록 ${pts}일` : "–");  // 연속 3일 미만은 조각선이라 글자로
    else { sp = svgEl("svg", { class: "spark", width: 92, height: 26, viewBox: "-2 -2 96 30", role: "img", "aria-label": `14일 누적 별 추이, 기록 ${pts}일` }); lines(sp, r.spark, 92, 26, max, "var(--amber)", 2); }
    return el("tr", {},
      el("td", { class: "c-rk" }, flaps(String(r.rank).padStart(2, "0"))),
      el("td", { class: "c-mv" }, moveBadge(r)),
      el("td", { class: "c-repo repo" }, link(`https://github.com/${r.name}`, r.name),
        r.desc ? el("div", { class: "desc" }, r.desc_ko || r.desc) : null, r.desc_ko ? orig(r.desc) : null),
      el("td", { class: "c-lang lang" }, r.lang || "–"),
      el("td", { class: "c-spark" }, sp),
      el("td", { class: "c-gain" }, flaps("+" + fmt(r.stars_week), { tone: r.name === g.top5[0] ? "amber" : "" })));
  });
  $("table").append(el("table", {}, el("caption", { class: "sr" }, "이번 주 별 증가 순위"), el("thead", {}, head), el("tbody", {}, ...rows)));

  const kv = (list, label, tone) => list.length
    ? list.map((e) => el("div", { class: "kv" }, link(`https://github.com/${e.name}`, e.name), el("span", { class: "mv " + tone }, label(e))))
    : [el("div", { class: "empty" }, g.repos.some((r) => r.move != null || r.is_new) ? "없음" : "어제 데이터가 쌓이면 표시")];
  $("entered").append(...kv(g.entered, (e) => `${e.rank}위`, "new"));
  $("dropped").append(...kv(g.dropped, (e) => `어제 ${e.rank}위`, "same"));

  const top = g.top5.map((n) => g.repos.find((r) => r.name === n));
  // x 범위는 상위 5개 중 하나라도 기록이 있는 첫 날부터 (빈 왼쪽 절반 방지)
  const first = Math.min(...top.map((r) => r.spark.findIndex((v) => v != null)).filter((i) => i >= 0));
  const days = h.dates14.slice(first), series = top.map((r) => r.spark.slice(first));
  const svg = svgEl("svg", { viewBox: "-10 -10 1220 300", role: "img", "aria-label": `상위 5개 레포의 누적 별 증가 선 그래프, ${days[0]}부터 ${days[days.length - 1]}까지`, style: "width:100%;height:auto;display:block" });
  for (let i = 0; i <= 4; i++) svg.append(svgEl("line", { x1: 0, x2: 1200, y1: i * 70, y2: i * 70, stroke: "#26282c" }));
  const tmax = maxOf(series);
  series.forEach((sp, i) => lines(svg, sp, 1200, 280, tmax, SERIES[i], 3));
  svg.querySelectorAll("polyline")[4]?.setAttribute("stroke-dasharray", "10 8");
  $("chart").append(svg, el("div", { class: "axis" }, el("span", {}, days[0].slice(5)), el("span", {}, `최대 +${fmt(tmax)}`), el("span", {}, days[days.length - 1].slice(5))));
  $("legend").append(...top.map((r, i) => el("span", {}, el("i", { style: i === 4 ? `background:repeating-linear-gradient(90deg,${SERIES[i]} 0 6px,transparent 6px 10px)` : `background:${SERIES[i]}` }), r.name)));
  if (top.every((r) => r.spark.filter((v) => v != null).length < 2)) $("legend").append(el("span", {}, "이틀 이상 쌓이면 선이 그려짐"));
}

function renderKeywords(k) {
  const box = $("keywords");
  if (!k.ready) { box.append(el("div", { class: "empty" }, "세 소스가 모두 수집된 날이 8일 쌓이면 표시됨")); return; }
  if (!k.items.length) { box.append(el("div", { class: "empty" }, "7일 평균보다 눈에 띄게 늘어난 단어 없음")); return; }
  box.append(el("div", { class: "kw" }, ...k.items.map((x) => el("div", { class: "kwrow" },
    el("div", {}, el("b", { lang: "en" }, x.word), el("small", {}, `오늘 ${x.today}회 · 7일 평균 ${x.avg}회`)),
    flaps(`+${x.change_pct}%`, { tone: "amber" })))));
}

function renderHN(src) {
  const box = $("hn");
  if (src.error) { box.append(failNote()); return; }
  const note = staleNote(src); if (note) box.append(note);
  box.append(...src.items.map((i) => el("div", { class: "item" },
    flaps(fmt(i.points), { width: 5 }),
    el("div", {}, link(i.url, i.title_ko || i.title, { class: "t" }), i.title_ko ? orig(i.title) : null,
      el("div", { class: "meta" }, `${i.domain} · `, link(i.hn_url, `댓글 ${fmt(i.comments)}`))))));
}

function renderArxiv(src) {
  const box = $("arxiv");
  if (src.error) { box.append(failNote()); return; }
  const note = staleNote(src); if (note) box.append(note);
  box.append(...src.papers.map((p) => el("div", { class: "item" },
    el("span", { class: "cat" }, p.cat || "–"),
    el("div", {}, link(p.url, p.title_ko || p.title, { class: "t" }), p.title_ko ? orig(p.title) : null,
      el("div", { class: "meta" }, `${p.first_author}${p.n_authors > 1 ? ` 외 ${p.n_authors - 1}명` : ""}`)))));
}

fetch("history.json", { cache: "no-store" })
  .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then((h) => {
    $("updated").textContent = `${h.updated} 갱신`;
    renderCounters(h); renderRepos(h); renderKeywords(h.keywords); renderHN(h.hn); renderArxiv(h.arxiv);
    cascade();
  })
  .catch((e) => { $("updated").textContent = `데이터를 불러오지 못함 (${e.message})`; });
</script>
</body>
</html>
